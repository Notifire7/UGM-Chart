<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>UGM Chart Builder — PTTNGD</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060B14;color:#E2E8F0;font-family:monospace;min-height:100vh;padding:20px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.card{background:#0D1627;border:1px solid #1E2D45;border-radius:10px;padding:20px}
.sec-label{font-size:11px;color:#38BDF8;letter-spacing:2px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:4px}
label{font-size:11px;color:#64748B}
input,select{padding:7px 10px;background:#060B14;border:1px solid #1E2D45;border-radius:6px;
  color:#E2E8F0;font-size:13px;font-family:monospace;outline:none;width:100%}
input:focus,select:focus{border-color:#3B82F6}
.btn-save{padding:8px 22px;background:#3B82F6;color:white;border:none;border-radius:6px;
  cursor:pointer;font-size:13px;font-family:monospace}
.btn-save:hover{background:#2563EB}
.btn-dl{padding:7px 16px;background:transparent;border:1px solid #38BDF8;color:#38BDF8;
  border-radius:6px;cursor:pointer;font-size:12px;font-family:monospace}
.btn-dl:hover{background:rgba(56,189,248,0.1)}
.error{color:#FCA5A5;font-size:12px;margin-bottom:10px;padding:6px 10px;
  background:rgba(239,68,68,0.08);border-radius:4px;border:1px solid rgba(239,68,68,0.2)}
table{border-collapse:collapse;width:100%;font-size:12px;min-width:600px}
th{padding:6px 12px;text-align:center;color:#64748B;border-bottom:1px solid #1E2D45;white-space:nowrap}
td{padding:7px 12px;text-align:center}
tr:nth-child(even){background:rgba(255,255,255,0.02)}
.btn-edit{background:none;border:none;color:#38BDF8;cursor:pointer;font-size:14px;margin-right:6px}
.btn-del{background:none;border:none;color:#EF4444;cursor:pointer;font-size:14px}
.chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
#chart-wrap{width:100%;overflow-x:auto}
svg{display:block}
.tbl-wrap{overflow-x:auto}
</style>
</head>
<body>
<div class="wrap">

  <!-- Header -->
  <div>
    <div style="font-size:10px;color:#64748B;letter-spacing:3px;margin-bottom:4px">PTTNGD · Hedging Analytics</div>
    <div style="font-size:22px;letter-spacing:-0.5px">UGM Chart Builder</div>
    <div style="height:2px;width:48px;background:#A78BFA;margin-top:8px;border-radius:2px"></div>
  </div>

  <!-- Form -->
  <div class="card">
    <div class="sec-label">INPUT DATA</div>
    <div class="grid">
      <div class="field">
        <label>เดือน</label>
        <select id="f-month">
          <option>Jan</option><option>Feb</option><option>Mar</option><option>Apr</option>
          <option>May</option><option selected>Jun</option><option>Jul</option><option>Aug</option>
          <option>Sep</option><option>Oct</option><option>Nov</option><option>Dec</option>
        </select>
      </div>
      <div class="field">
        <label style="color:#3B82F6">Hedged UGM</label>
        <input type="number" id="f-hedgedUGM" placeholder="69"/>
      </div>
      <div class="field">
        <label style="color:#F5C242">Unhedged UGM</label>
        <input type="number" id="f-unhedgedUGM" placeholder="(ถ้ามี)"/>
      </div>
      <div class="field">
        <label style="color:#EF4444">Budget UGM</label>
        <input type="number" id="f-budgetUGM" placeholder="100"/>
      </div>
      <div class="field">
        <label style="color:#94A3B8">% Hedged</label>
        <input type="number" id="f-hedgedPct" placeholder="70" min="0" max="100"/>
      </div>
      <div class="field">
        <label style="color:#94A3B8">% Unhedged</label>
        <input type="number" id="f-unhedgedPct" placeholder="30" min="0" max="100"/>
      </div>
    </div>
    <div id="err" class="error" style="display:none"></div>
    <button class="btn-save" onclick="saveRow()">+ บันทึก</button>
  </div>

  <!-- Table -->
  <div class="card" id="table-card" style="display:none">
    <div class="sec-label">DATA TABLE</div>
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th>เดือน</th><th>Hedged UGM</th><th>Unhedged UGM</th>
            <th>Budget UGM</th><th>% Hedged</th><th>% Unhedged</th><th></th>
          </tr>
        </thead>
        <tbody id="tbl-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Avg Input -->
  <div class="card">
    <div class="sec-label">AVG 2026 (manual)</div>
    <div class="grid">
      <div class="field"><label style="color:#3B82F6">Hedged UGM (avg)</label><input type="number" id="a-hedgedUGM" placeholder="68"/></div>
      <div class="field"><label style="color:#F5C242">Unhedged UGM (avg)</label><input type="number" id="a-unhedgedUGM" placeholder="(ถ้ามี)"/></div>
      <div class="field"><label style="color:#EF4444">Budget UGM (avg)</label><input type="number" id="a-budgetUGM" placeholder="116"/></div>
      <div class="field"><label style="color:#94A3B8">% Hedged (avg)</label><input type="number" id="a-hedgedPct" placeholder="82" min="0" max="100"/></div>
      <div class="field"><label style="color:#94A3B8">% Unhedged (avg)</label><input type="number" id="a-unhedgedPct" placeholder="18" min="0" max="100"/></div>
      <div class="field"><label style="color:#64748B">ช่วงเดือน (label)</label><input type="text" id="a-label" placeholder="Jan-Mar 2026"/></div>
    </div>
    <button class="btn-save" onclick="saveAvg()">✓ บันทึก Avg</button>
  </div>

  <!-- Chart -->
  <div class="card">
    <div class="chart-header">
      <div class="sec-label" style="margin-bottom:0">CHART PREVIEW</div>
      <button class="btn-dl" onclick="downloadPNG()">↓ Download PNG</button>
    </div>
    <div id="chart-wrap"></div>
  </div>

</div>

<script>
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const C = {
  blue:'#3B82F6',yellow:'#F5C242',red:'#EF4444',purple:'#A78BFA',
  cyan:'#38BDF8',bg1:'#0D1627',border:'#1E2D45',muted:'#64748B',dim:'#94A3B8'
};

let rows = [
  {month:'Jan',hedgedUGM:69, unhedgedUGM:95, budgetUGM:84, hedgedPct:73,unhedgedPct:27},
  {month:'Feb',hedgedUGM:79, unhedgedUGM:133,budgetUGM:94, hedgedPct:89,unhedgedPct:11},
  {month:'Mar',hedgedUGM:61, unhedgedUGM:312,budgetUGM:101,hedgedPct:82,unhedgedPct:18},
  {month:'Apr',hedgedUGM:126,unhedgedUGM:null,budgetUGM:115,hedgedPct:70,unhedgedPct:30},
  {month:'May',hedgedUGM:205,unhedgedUGM:null,budgetUGM:119,hedgedPct:18,unhedgedPct:82},
];

let avgRow = null;

// Auto-sync % fields (monthly)
document.getElementById('f-hedgedPct').addEventListener('input',function(){
  const v = parseFloat(this.value)||0;
  document.getElementById('f-unhedgedPct').value = Math.max(0,100-v);
});
document.getElementById('f-unhedgedPct').addEventListener('input',function(){
  const v = parseFloat(this.value)||0;
  document.getElementById('f-hedgedPct').value = Math.max(0,100-v);
});

// Auto-sync % fields (avg)
document.getElementById('a-hedgedPct').addEventListener('input',function(){
  const v = parseFloat(this.value)||0;
  document.getElementById('a-unhedgedPct').value = Math.max(0,100-v);
});
document.getElementById('a-unhedgedPct').addEventListener('input',function(){
  const v = parseFloat(this.value)||0;
  document.getElementById('a-hedgedPct').value = Math.max(0,100-v);
});

function saveAvg(){
  const hp = parseFloat(document.getElementById('a-hedgedPct').value)||0;
  const up = parseFloat(document.getElementById('a-unhedgedPct').value)||(100-hp);
  const hU = parseFloat(document.getElementById('a-hedgedUGM').value);
  const bU = parseFloat(document.getElementById('a-budgetUGM').value);
  if(isNaN(hU)||isNaN(bU)){alert('กรุณากรอก Hedged UGM และ Budget UGM');return;}
  avgRow = {
    hedgedUGM: hU,
    unhedgedUGM: parseFloat(document.getElementById('a-unhedgedUGM').value)||null,
    budgetUGM: bU,
    hedgedPct: hp, unhedgedPct: up,
    label: document.getElementById('a-label').value||''
  };
  render();
}

function getForm(){
  return {
    month:      document.getElementById('f-month').value,
    hedgedUGM:  parseFloat(document.getElementById('f-hedgedUGM').value),
    unhedgedUGM:parseFloat(document.getElementById('f-unhedgedUGM').value)||null,
    budgetUGM:  parseFloat(document.getElementById('f-budgetUGM').value),
    hedgedPct:  parseFloat(document.getElementById('f-hedgedPct').value),
    unhedgedPct:parseFloat(document.getElementById('f-unhedgedPct').value)||0,
  };
}

function setForm(r){
  document.getElementById('f-month').value        = r.month;
  document.getElementById('f-hedgedUGM').value    = r.hedgedUGM;
  document.getElementById('f-unhedgedUGM').value  = r.unhedgedUGM??'';
  document.getElementById('f-budgetUGM').value    = r.budgetUGM;
  document.getElementById('f-hedgedPct').value    = r.hedgedPct;
  document.getElementById('f-unhedgedPct').value  = r.unhedgedPct;
}

function clearForm(nextMonth){
  ['hedgedUGM','unhedgedUGM','budgetUGM','hedgedPct','unhedgedPct'].forEach(k=>{
    document.getElementById('f-'+k).value='';
  });
  document.getElementById('f-month').value = nextMonth||'Jun';
}

function showError(msg){
  const el=document.getElementById('err');
  el.textContent='⚠ '+msg; el.style.display='block';
}
function hideError(){ document.getElementById('err').style.display='none'; }

function saveRow(){
  const f=getForm();
  if(isNaN(f.hedgedUGM)||isNaN(f.budgetUGM)||isNaN(f.hedgedPct)){
    showError('กรุณากรอก Hedged UGM, Budget UGM และ % Hedged'); return;
  }
  if(Math.abs(f.hedgedPct+f.unhedgedPct-100)>0.5){
    showError('% Hedged + % Unhedged ต้องรวมได้ 100%'); return;
  }
  hideError();
  rows = rows.filter(r=>r.month!==f.month);
  rows.push(f);
  rows.sort((a,b)=>MONTHS.indexOf(a.month)-MONTHS.indexOf(b.month));
  const ni = (MONTHS.indexOf(f.month)+1)%12;
  clearForm(MONTHS[ni]);
  render();
}

function deleteRow(month){
  rows = rows.filter(r=>r.month!==month);
  render();
}

function editRow(month){
  const r = rows.find(r=>r.month===month);
  if(r) setForm(r);
}

function render(){
  renderTable();
  renderChart();
}

function renderTable(){
  const card = document.getElementById('table-card');
  const tbody = document.getElementById('tbl-body');
  if(rows.length===0){card.style.display='none';return;}
  card.style.display='block';
  tbody.innerHTML = rows.map((r,i)=>`
    <tr>
      <td style="color:${C.cyan}">${r.month}</td>
      <td style="color:${C.blue}">${r.hedgedUGM}</td>
      <td style="color:${C.yellow}">${r.unhedgedUGM??'<span style="color:#1E2D45">—</span>'}</td>
      <td style="color:${C.red}">${r.budgetUGM}</td>
      <td style="color:${C.dim}">${r.hedgedPct}%</td>
      <td style="color:${C.dim}">${r.unhedgedPct}%</td>
      <td>
        <button class="btn-edit" onclick="editRow('${r.month}')">✎</button>
        <button class="btn-del"  onclick="deleteRow('${r.month}')">✕</button>
      </td>
    </tr>
  `).join('');
}

function renderChart(){
  const W=980, H=450, MT=44, MR=32, MB=72, ML=62;
  const cW=W-ML-MR, cH=H-MT-MB;

  // avgRow comes from manual input (global variable)

  // --- Scale ---
  const allV = [
    ...rows.flatMap(r=>[r.hedgedUGM,r.unhedgedUGM,r.budgetUGM].filter(v=>v!=null&&v>0)),
    ...(avgRow?[avgRow.hedgedUGM,avgRow.unhedgedUGM,avgRow.budgetUGM].filter(v=>v!=null&&v>0):[])
  ];
  const rawMax = Math.max(...allV,100);
  const maxUGM = Math.ceil(rawMax*1.18/50)*50;
  const toY = v => cH-(v/maxUGM)*cH;
  const step = maxUGM>400?100:maxUGM>200?50:25;
  const ticks=[]; for(let v=0;v<=maxUGM;v+=step) ticks.push(v);

  // --- Slots: Jan-Dec (12) + gap + Avg (1) = 14 total ---
  const disp = [...MONTHS, '__gap__', 'Avg'];
  const slotW = cW/disp.length;
  const bTW   = slotW*0.78;

  const triSVG='';

  // --- Draw each slot ---
  let bars='';
  disp.forEach((month,i)=>{
    if(month==='__gap__') return; // invisible separator slot
    const isAvg = month==='Avg';
    const row   = isAvg ? avgRow : rows.find(r=>r.month===month);
    const sx    = ML+i*slotW;
    const bl    = sx+(slotW-bTW)/2;
    const base  = MT+cH;

    // separator dashed line before Avg
    if(isAvg){
      bars+=`<line x1="${sx}" y1="${MT}" x2="${sx}" y2="${base}" stroke="${C.border}" stroke-width="1" stroke-dasharray="3,3"/>`;
    }

    // month label
    const hasData = !isAvg && rows.find(r=>r.month===month);
    const lCol = isAvg ? C.cyan : (hasData ? C.cyan : '#2A3D55');
    bars+=`<text x="${sx+slotW/2}" y="${base+20}" text-anchor="middle" font-size="10" fill="${lCol}" font-family="monospace">${isAvg?'Avg 2026':month}</text>`;

    if(isAvg && rows.length>0){
      const sub = avgRow.label||'';
      bars+=`<text x="${sx+slotW/2}" y="${base+32}" text-anchor="middle" font-size="8" fill="${C.cyan}" font-family="monospace" opacity="0.6">${sub} 2026</text>`;
    }

    if(!row) return;

    const hW=(row.hedgedPct/100)*bTW, uW=(row.unhedgedPct/100)*bTW;
    const hH=(row.hedgedUGM/maxUGM)*cH;
    const uH=row.unhedgedUGM?(row.unhedgedUGM/maxUGM)*cH:0;
    const bY=MT+toY(row.budgetUGM);

    // hedged bar
    bars+=`<rect x="${bl}" y="${base-hH}" width="${hW}" height="${hH}" fill="${C.blue}" rx="2"/>`;
    if(hH>22) bars+=`<text x="${bl+hW/2}" y="${base-6}" text-anchor="middle" font-size="9" fill="white" font-family="monospace">${row.hedgedPct}%</text>`;
    bars+=`<text x="${bl+hW/2}" y="${base-hH-5}" text-anchor="middle" font-size="10" fill="${C.blue}" font-family="monospace">${row.hedgedUGM}</text>`;

    // unhedged bar
    if(row.unhedgedUGM&&uH>0){
      bars+=`<rect x="${bl+hW}" y="${base-uH}" width="${uW}" height="${uH}" fill="${C.yellow}" rx="2"/>`;
      if(uH>22) bars+=`<text x="${bl+hW+uW/2}" y="${base-6}" text-anchor="middle" font-size="9" fill="#1A1100" font-family="monospace">${row.unhedgedPct}%</text>`;
      bars+=`<text x="${bl+hW+uW/2}" y="${base-uH-5}" text-anchor="middle" font-size="10" fill="${C.yellow}" font-family="monospace">${row.unhedgedUGM}</text>`;
    } else if(!isAvg&&uW>0){
      bars+=`<rect x="${bl+hW}" y="${base-14}" width="${uW}" height="14" fill="${C.yellow}" rx="2" opacity="0.18"/>`;
      if(uW>16) bars+=`<text x="${bl+hW+uW/2}" y="${base-4}" text-anchor="middle" font-size="8" fill="${C.yellow}" opacity="0.5" font-family="monospace">${row.unhedgedPct}%</text>`;
    }

    // budget dashed line + value label
    bars+=`<line x1="${bl}" y1="${bY}" x2="${bl+bTW}" y2="${bY}" stroke="${C.red}" stroke-width="1.8" stroke-dasharray="5,3"/>`;
    bars+=`<text x="${bl+bTW+4}" y="${bY+4}" font-size="9" fill="${C.red}" font-family="monospace">${row.budgetUGM}</text>`;
  });

  // --- Grid & axes ---
  const gridLines = ticks.map(v=>`
    <line x1="${ML}" y1="${MT+toY(v)}" x2="${ML+cW}" y2="${MT+toY(v)}" stroke="${C.border}" stroke-width="0.8"/>
    <text x="${ML-8}" y="${MT+toY(v)+4}" text-anchor="end" font-size="10" fill="${C.muted}" font-family="monospace">${v}</text>
  `).join('');

  // --- Legend (top-right) ---
  const lx=W-230, ly=8;
  const legend=`
    <rect x="${lx}" y="${ly}" width="10" height="10" fill="${C.blue}" rx="2"/>
    <text x="${lx+14}" y="${ly+9}" font-size="9" fill="${C.dim}" font-family="monospace">Locked UGM 2026</text>
    <rect x="${lx}" y="${ly+16}" width="10" height="10" fill="${C.yellow}" rx="2"/>
    <text x="${lx+14}" y="${ly+25}" font-size="9" fill="${C.dim}" font-family="monospace">Floating UGM 2026</text>
    <polygon points="${lx+5},${ly+32} ${lx},${ly+43} ${lx+10},${ly+43}" fill="#22C55E"/>
    <text x="${lx+14}" y="${ly+43}" font-size="9" fill="${C.dim}" font-family="monospace">Avg. UGM (Higher than Budget)</text>
    <polygon points="${lx},${ly+49} ${lx+10},${ly+49} ${lx+5},${ly+60}" fill="${C.red}"/>
    <text x="${lx+14}" y="${ly+60}" font-size="9" fill="${C.dim}" font-family="monospace">Avg. UGM (Lower than Budget)</text>
  `;

  const axEnd=ML+cW, axY=MT+cH;
  const svg=`<svg id="ugm-svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"
    style="max-width:100%;height:auto" xmlns="http://www.w3.org/2000/svg">
    <rect width="${W}" height="${H}" fill="${C.bg1}" rx="8"/>
    ${gridLines}
    <line x1="${ML}" y1="${MT-10}" x2="${ML}" y2="${MT+cH}" stroke="${C.purple}" stroke-width="1.5"/>
    <polygon points="${ML},${MT-14} ${ML-4},${MT+4} ${ML+4},${MT+4}" fill="${C.purple}"/>
    <text transform="translate(14,${MT+cH/2}) rotate(-90)" text-anchor="middle" font-size="10" fill="${C.purple}" font-family="monospace">UGM (THB/MMBtu)</text>
    <line x1="${ML}" y1="${axY}" x2="${axEnd+10}" y2="${axY}" stroke="${C.border}" stroke-width="1"/>
    <polygon points="${axEnd+14},${axY} ${axEnd+6},${axY-4} ${axEnd+6},${axY+4}" fill="${C.border}"/>
    ${bars}
    ${triSVG}
    ${legend}
  </svg>`;

  document.getElementById('chart-wrap').innerHTML=svg;
}

function downloadPNG(){
  const svg=document.getElementById('ugm-svg');
  if(!svg){alert('ไม่พบ chart');return;}
  const xml=new XMLSerializer().serializeToString(svg);
  const blob=new Blob([xml],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas');
    c.width=1640;c.height=860;
    const ctx=c.getContext('2d');
    ctx.fillStyle='#0D1627';
    ctx.fillRect(0,0,c.width,c.height);
    ctx.drawImage(img,0,0,c.width,c.height);
    const a=document.createElement('a');
    a.download='ugm_hedging_chart.png';
    a.href=c.toDataURL('image/png');
    a.click();
    URL.revokeObjectURL(url);
  };
  img.src=url;
}

// init
render();
</script>
</body>
</html>
